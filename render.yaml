services:
  - type: web
    name: leadtime-updater
    runtime: docker
    region: singapore
    plan: starter            # 履歴を残すにはDiskが必要で、Diskは有料プランのみ
    healthCheckPath: /healthz
    disk:
      name: leadtime-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SP_CLIENT_ID
        sync: false
      - key: SP_CLIENT_SECRET
        sync: false
      - key: SP_REFRESH_TOKEN
        sync: false
      - key: SP_SELLER_ID
        sync: false
